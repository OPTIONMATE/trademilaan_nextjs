# Hourly trigger for the periodic admin report.
# The app decides whether a report is due (schedule is set in
# /admin-dashboard/reports), so calls outside the scheduled time are no-ops.
# Required repository secrets: APP_URL (e.g. https://www.trademilaan.com), CRON_SECRET.
# Vercel Cron (vercel.json) calls the same endpoint daily as a fallback.
name: Admin report scheduler

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call admin report endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set"; exit 1
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/admin-report"
